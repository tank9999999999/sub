name: Update Subscription

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成订阅 (sub.txt / links.txt)
        run: node gen-sub.mjs

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt links.txt
          git diff --cached --quiet || git commit -m "chore: update sub $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
